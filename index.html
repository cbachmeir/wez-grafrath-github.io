<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
       <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>
    html, body {
        background-color: #ffffff;
    }

    .ol-control > * {
        background-color: #f8f8f8!important;
        color: #444444!important;
        border-radius: 0px;
    }

    .ol-attribution a,
    .gcd-gl-input::placeholder,
    .search-layer-input-search::placeholder {
        color: #444444!important;
    }

    .search-layer-input-search {
        background-color: #f8f8f8!important;
    }

    .ol-control > *:focus,
    .ol-control >*:hover {
        background-color: rgba(248, 248, 248, 0.7)!important;
    }

    .ol-control {
        background-color: rgba(255,255,255,.4) !important;
        padding: 2px !important;
    }

    #map {
        width: 1279px;
        height: 843px;
    }

    /* ================================
       Standort-Status
       ================================ */

    #location-status {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;

        display: none;

        padding: 8px 14px;
        border-radius: 20px;

        background: rgba(255,255,255,0.95);
        color: #333;

        font-family: Arial, sans-serif;
        font-size: 14px;

        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    #location-status.active {
        display: block;
    }

    /* ================================
       Standort-Button
       ================================ */

    #location-button {
        position: absolute;
        right: 10px;
        top: 10px;

        z-index: 1000;

        width: 42px;
        height: 42px;

        border: none;
        border-radius: 4px;

        background: #f8f8f8;
        color: #444;

        font-size: 22px;
        line-height: 42px;

        text-align: center;

        cursor: pointer;

        box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    #location-button:hover {
        background: #e8e8e8;
    }

    #location-button.active {
        background: #1976d2;
        color: white;
    }

    /* ================================
       Standort-Punkt
       ================================ */

    .location-marker {
        width: 18px;
        height: 18px;

        background: #1976d2;

        border: 3px solid white;
        border-radius: 50%;

        box-shadow:
            0 0 0 2px rgba(25,118,210,0.35),
            0 2px 5px rgba(0,0,0,0.4);

        box-sizing: border-box;
    }

    .location-accuracy {
        width: 100px;
        height: 100px;

        border-radius: 50%;

        background: rgba(25,118,210,0.12);
        border: 1px solid rgba(25,118,210,0.35);

        box-sizing: border-box;
    }

    /* Smartphone */
    @media (max-width: 600px) {
        #map {
            width: 100%;
            height: 100vh;
        }

        #location-button {
            right: 10px;
            top: 60px;
        }

        #location-status {
            top: 10px;
            font-size: 13px;
            max-width: 80%;
            text-align: center;
        }
    }
    </style>

    <title>Karte</title>
</head>

<body>

    <!-- Karte -->
    <div id="map">

        <!-- Popup -->
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>

        <!-- Standortstatus -->
        <div id="location-status">
            Standort wird ermittelt ...
        </div>

        <!-- Standortbutton -->
        <button
            id="location-button"
            type="button"
            title="Standort verfolgen"
            aria-label="Standort verfolgen">
            📍
        </button>

    </div>

    <!-- Bestehende QGIS2Web-Dateien -->
    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>

    <script src="layers/Flaechen_1.js"></script>
    <script src="layers/Linien_2.js"></script>
    <script src="layers/Punkte_3.js"></script>

    <script src="styles/Flaechen_1_style.js"></script>
    <script src="styles/Linien_2_style.js"></script>
    <script src="styles/Punkte_3_style.js"></script>

    <script src="./layers/layers.js" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>


    <!-- =========================================
         AUTOMATISCHE STANDORTVERFOLGUNG
         ========================================= -->

    <script>

    // Standort-Layer
    const locationSource = new ol.source.Vector();

    const locationLayer = new ol.layer.Vector({
        source: locationSource,
        zIndex: 9999
    });

    // Standort-Layer zur Karte hinzufügen
    map.addLayer(locationLayer);


    // Aktuelle Position
    let locationFeature = null;

    // Genauigkeitskreis
    let accuracyFeature = null;

    // Geolocation-Überwachung
    let watchId = null;

    // Verhindert, dass die Karte bei jeder Bewegung
    // automatisch neu zentriert wird
    let firstLocation = true;


    // -----------------------------------------
    // Standort-Styles
    // -----------------------------------------

    const locationStyle = new ol.style.Style({
        image: new ol.style.Circle({
            radius: 8,

            fill: new ol.style.Fill({
                color: '#1976d2'
            }),

            stroke: new ol.style.Stroke({
                color: '#ffffff',
                width: 3
            })
        })
    });


    // -----------------------------------------
    // Genauigkeitskreis
    // -----------------------------------------

    const accuracyStyle = new ol.style.Style({
        fill: new ol.style.Fill({
            color: 'rgba(25,118,210,0.12)'
        }),

        stroke: new ol.style.Stroke({
            color: 'rgba(25,118,210,0.35)',
            width: 1
        })
    });


    // -----------------------------------------
    // Statusanzeige
    // -----------------------------------------

    const locationStatus =
        document.getElementById('location-status');

    const locationButton =
        document.getElementById('location-button');


    // -----------------------------------------
    // Standort starten
    // -----------------------------------------

    function startLocationTracking() {

        if (!navigator.geolocation) {

            locationStatus.textContent =
                'Standortbestimmung wird von diesem Browser nicht unterstützt.';

            locationStatus.classList.add('active');

            return;
        }


        // Button aktiv
        locationButton.classList.add('active');

        locationStatus.textContent =
            '📍 Standort wird ermittelt ...';

        locationStatus.classList.add('active');


        // Bereits vorhandene Überwachung stoppen
        if (watchId !== null) {

            navigator.geolocation.clearWatch(watchId);

        }


        // Standort verfolgen
        watchId = navigator.geolocation.watchPosition(

            function(position) {

                const longitude =
                    position.coords.longitude;

                const latitude =
                    position.coords.latitude;

                const accuracy =
                    position.coords.accuracy;


                // OpenLayers-Projektion:
                // GPS liefert WGS84 (EPSG:4326),
                // die Karte verwendet normalerweise EPSG:3857.

                const coordinates =
                    ol.proj.fromLonLat([
                        longitude,
                        latitude
                    ]);


                // ---------------------------------
                // Standortpunkt erstellen
                // ---------------------------------

                if (!locationFeature) {

                    locationFeature =
                        new ol.Feature({
                            geometry:
                                new ol.geom.Point(coordinates)
                        });

                    locationFeature.setStyle(locationStyle);

                    locationSource.addFeature(
                        locationFeature
                    );

                } else {

                    locationFeature
                        .getGeometry()
                        .setCoordinates(coordinates);

                }


                // ---------------------------------
                // Genauigkeitskreis
                // ---------------------------------

                if (!accuracyFeature) {

                    accuracyFeature =
                        new ol.Feature();

                    accuracyFeature.setStyle(
                        accuracyStyle
                    );

                    locationSource.addFeature(
                        accuracyFeature
                    );
                }


                accuracyFeature.setGeometry(
                    ol.geom.Polygon.circular(
                        ol.proj.toLonLat(coordinates),
                        accuracy,
                        64
                    )
                );


                // ---------------------------------
                // Karte beim ersten Standort
                // zentrieren
                // ---------------------------------

                if (firstLocation) {

                    map.getView().animate({
                        center: coordinates,
                        zoom: 17,
                        duration: 1000
                    });

                    firstLocation = false;
                }


                // ---------------------------------
                // Status anzeigen
                // ---------------------------------

                locationStatus.textContent =
                    '📍 Standort aktiv – Genauigkeit ca. ' +
                    Math.round(accuracy) +
                    ' m';

                locationStatus.classList.add('active');


                // Nach einigen Sekunden Status
                // wieder ausblenden

                setTimeout(function() {

                    locationStatus.classList.remove(
                        'active'
                    );

                }, 3000);

            },

            function(error) {

                let message =
                    'Standort konnte nicht ermittelt werden.';

                switch (error.code) {

                    case error.PERMISSION_DENIED:
                        message =
                            '⚠️ Standortzugriff wurde verweigert.';
                        break;

                    case error.POSITION_UNAVAILABLE:
                        message =
                            '⚠️ Standort momentan nicht verfügbar.';
                        break;

                    case error.TIMEOUT:
                        message =
                            '⚠️ Zeitüberschreitung bei der Standortbestimmung.';
                        break;
                }


                locationStatus.textContent = message;

                locationStatus.classList.add('active');

                locationButton.classList.remove('active');

            },

            {
                enableHighAccuracy: true,

                maximumAge: 5000,

                timeout: 15000
            }
        );
    }


    // -----------------------------------------
    // Standortverfolgung stoppen
    // -----------------------------------------

    function stopLocationTracking() {

        if (watchId !== null) {

            navigator.geolocation.clearWatch(
                watchId
            );

            watchId = null;
        }

        locationButton.classList.remove(
            'active'
        );

        locationStatus.textContent =
            'Standortverfolgung beendet.';

        locationStatus.classList.add(
            'active'
        );

        setTimeout(function() {

            locationStatus.classList.remove(
                'active'
            );

        }, 2000);
    }


    // -----------------------------------------
    // Button
    // -----------------------------------------

    locationButton.addEventListener(
        'click',
        function() {

            if (watchId === null) {

                firstLocation = true;

                startLocationTracking();

            } else {

                stopLocationTracking();

            }

        }
    );

    </script>

</body></html>
